# Pipeline de A-Fénix. Parte del borrador de la IA (evidencias/entrega-final/ci_borrador_ia.yml)
# y se corrigió con la lista de revisión de pipelines del curso: ver docs/revision_configuracion.md.
name: CI

on:
  push:
  pull_request:
    branches: [main]

# El pipeline solo lee el código; no necesita escribir en el repositorio
permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias con versión fijada
        run: pip install -r requirements-dev.txt

      - name: Pruebas con cobertura
        run: python -m pytest -v --cov=afenix --cov-report=term-missing --cov-fail-under=95

      - name: Linter (ruff)
        run: ruff check .

      - name: Tipos (mypy)
        run: mypy

      - name: Seguridad del código (bandit)
        run: bandit -c pyproject.toml -r afenix

      - name: Vulnerabilidades en dependencias (pip-audit)
        run: pip-audit -r requirements-dev.txt
