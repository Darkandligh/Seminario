[project]
name = "afenix"
version = "0.2.0"
description = "Plataforma de comandas digitales para el restaurante A Fénix de Oro"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# assert es la forma normal de comprobar en pytest
"tests/*" = ["S101"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["afenix"]
